name: Prepare central memory review
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Número da issue de contribuição pública
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: central-memory-review
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare a data-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CENTRAL_ISSUE: ${{ inputs.issue }}
        run: node scripts/central-memory/review.mjs
