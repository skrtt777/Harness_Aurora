<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1e">
<title>Aurora XR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" data-layout="split">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><b>Aurora</b><span class="ctx" id="ctx">Conversa geral</span></div>
    <div class="status"><span class="pill" id="conn" data-state="wait">Conectando…</span></div>
    <div class="modes" id="modes" role="group" aria-label="Modos imersivos"></div>
  </header>

  <section class="stage" id="stage" aria-label="Vista 3D">
    <canvas id="view"></canvas>
    <div class="stage-hud">
      <span class="live" id="live"></span>
      <span class="seal" id="seal"></span>
    </div>
    <div class="stage-tools">
      <button class="tool" id="motion" hidden aria-pressed="false" title="Girar a vista com o movimento do aparelho">Movimento</button>
      <button class="tool" id="recenter" title="Voltar a vista para a maquete">Centralizar</button>
    </div>
    <div class="hint" id="hint" hidden></div>
  </section>

  <section class="panel" id="panel">
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-page="conversa" aria-selected="true">Conversa</button>
      <button role="tab" data-page="operacao">Operação</button>
      <button role="tab" data-page="cenarios">Cenários</button>
      <button role="tab" data-page="memorias">Memórias</button>
      <button role="tab" data-page="projetos">Projetos</button>
      <button role="tab" data-page="ajustes">Ajustes</button>
    </nav>
    <div class="page" id="page"></div>
  </section>
</div>

<dialog id="pair" class="pair">
  <form method="dialog" id="pairForm">
    <h2>Parear com a Aurora do PC</h2>
    <p class="muted" id="pairWhy">Este aparelho ainda não conhece a Aurora do seu PC. No PC, abra <b>Ajustes › Parear aparelho</b> no Aurora XR e digite aqui o código de 6 dígitos.</p>
    <label class="code"><span>Código</span><input id="pairCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required></label>
    <label><span>Nome deste aparelho</span><input id="pairName" maxlength="80"></label>
    <p class="err" id="pairErr" hidden></p>
    <div class="row"><button class="primary" id="pairGo" value="go">Parear</button></div>
  </form>
</dialog>

<script type="module" src="main.js"></script>
</body>
</html>
